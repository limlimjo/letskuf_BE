name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: letskuf-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: letskuf-backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$REGISTRY/$ECR_REPOSITORY:latest" \
            --push .

      - name: Deploy to EC2 via SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          cat > deploy-backend.sh <<'REMOTE'
          #!/bin/bash
          set -euo pipefail

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${REGISTRY}/letskuf-backend:${IMAGE_TAG}"

          echo "Logging in to ECR..."
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE"

          echo "Stopping existing backend container..."
          docker rm -f letskuf-backend 2>/dev/null || true

          echo "Starting backend container..."
          docker run -d \
            --name letskuf-backend \
            --restart unless-stopped \
            --env-file /opt/letskuf/backend.env \
            -p 127.0.0.1:8080:8080 \
            "$IMAGE"

          echo "Waiting for application startup..."
          sleep 10

          echo "Container status:"
          docker ps -a --filter name=letskuf-backend

          echo "Backend logs:"
          docker logs --tail 50 letskuf-backend
          REMOTE

          # EC2에서 실행할 명령을 JSON으로 생성
          jq -n \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            --arg tag "$IMAGE_TAG" \
            --rawfile script deploy-backend.sh \
            '{
              commands: [
                "cat > /tmp/deploy-backend.sh << '\''DEPLOY_SCRIPT'\''\n" +
                $script +
                "\nDEPLOY_SCRIPT\n" +
                "chmod +x /tmp/deploy-backend.sh\n" +
                "export AWS_ACCOUNT_ID=" + $account +
                " AWS_REGION=" + $region +
                " IMAGE_TAG=" + $tag + "\n" +
                "bash /tmp/deploy-backend.sh"
              ]
            }' > ssm-parameters.json

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --comment "Deploy letskuf backend ${IMAGE_TAG}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"
          INVOCATION=""

          for attempt in $(seq 1 60); do
            INVOCATION=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>/dev/null || true)

            STATUS=$(printf '%s' "$INVOCATION" |
              jq -r '.Status // "Pending"')

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled|Undeliverable|Terminated)
                break
                ;;
            esac

            sleep 5
          done

          echo "Deployment status: $STATUS"

          if [ -n "$INVOCATION" ]; then
            echo "----- STDOUT -----"
            printf '%s' "$INVOCATION" |
              jq -r '.StandardOutputContent // ""'

            echo "----- STDERR -----"
            printf '%s' "$INVOCATION" |
              jq -r '.StandardErrorContent // ""'
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "SSM deployment failed or timed out."
            exit 1
          fi

          echo "Backend deployment completed successfully."