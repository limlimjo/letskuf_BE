spring:
    application:
      name: letskuf
    datasource:
      url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
    servlet:
      multipart:
        max-file-size:
          50MB
        max-request-size:
          50MB
    mvc:
      view:
        prefix: /WEB-INF/view/
        suffix: .jsp

cloud:
  aws:
    s3:
      bucket: letskuf-bucket
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}

logging:
    level:
        root: DEBUG

mybatis:
    # Eclipse 설정
    # mybatis.mapper-locations=classpath:com/baemin/mybatis/*.xml
    # IntelljJ 설정
    mapper-locations: classpath:mybatis/*.xml
    # cf) mybatis.configuration.map-underscore-to-camel-case=true와 mybatis.config-location: classpath:mybatis-config.xml 동시에 존재x
    type-aliases-package: com.letskuf.dto
    configuration:
        map-underscore-to-camel-case: true

server:
    port: 8080